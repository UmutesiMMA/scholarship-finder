<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/b46022a755.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Scholarship Finder</title>
  </head>
  <body>
    <div class="page-wrap">

      <section class="hero">
        <h1>Find scholarships that <em>actually fit you</em></h1>
        <p>Search 50+ scholarships, grants and fellowships, then narrow by type, deadline and eligibility.</p>
        <div class="hero-search">
          <label class="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="search-input"
              placeholder="Search by name, organization or keyword…"
              aria-label="Search scholarships"
            />
          </label>
          <button class="btn-tailored" id="open-tailored-btn">
            <i class="fa-solid fa-sliders"></i>
            Get tailored matches
          </button>
        </div>
      </section>

      <div class="profile-bar" id="profile-bar" hidden>
        <span class="profile-label">Your profile:</span>
        <div class="profile-tags" id="profile-tags"></div>
      </div>

      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-view="browse" aria-selected="true">Browse all</button>
        <button class="tab" role="tab" data-view="saved" aria-selected="false">
          <i class="fa-solid fa-bookmark"></i>
          Saved
          <span class="tab-count" id="saved-count">0</span>
        </button>
      </div>

      <div class="filter-row">
        <div class="filter-chips" id="filter-chips"></div>
        <select class="sort-select" id="sort-select" aria-label="Sort">
          <option value="default">Sort: Default</option>
          <option value="az">Sort: A-Z</option>
          <option value="deadline">Sort: Due date</option>
        </select>
      </div>

      <section class="available-scholarships"></section>

    </div>

    <dialog class="eligibility-dialog">
      <p>Get scholarships tailored to you</p>
      <form action="" class="eligibility-form">
        <label for="residency">Residency</label>
        <select name="residency" id="residency"></select>
        <label for="ed_level">Education level</label>
        <select name="ed_level" id="ed_level">
          <option value="">Choose education level</option>
          <option value="any">Any</option>
          <option value="middle-school">Middle school</option>
          <option value="high-school">High school</option>
          <option value="high-school-senior">High school senior</option>
          <option value="ged">GED</option>
          <option value="undergraduate">Undergraduate</option>
          <option value="community-college">Community College</option>
          <option value="graduate">Graduate</option>
          <option value="vocational">Vocational</option>
          <option value="adult-returning">Adult returning</option>
        </select>
        <label for="study_field">Field of study</label>
        <input type="text" name="study_field" id="study_field" />
        <label for="gpa">GPA</label>
        <input type="number" name="gpa" id="gpa" step="0.1" min="0" max="4" />
        <div>
          <button class="eligibility-cancel-btn" type="button">Cancel</button>
          <button class="eligibility-calc-btn" type="submit">Tailor scholarships</button>
        </div>
      </form>
    </dialog>

    <script src="utils.js"></script>
    <script src="index.js"></script>
  </body>
</html>

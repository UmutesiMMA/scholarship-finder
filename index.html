<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/b46022a755.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Scholarship-finder</title>
  </head>
  <body>
    <h1>Scholarship-finder</h1>
    <section class="action-buttons">
      <div class="dropdown-wrapper">
        <button type="button" id="filter-btn" title="Filter">
          <span id="filter-label">All</span>
          <i class="fa-solid fa-filter"></i>
        </button>
        <ul class="dropdown-menu" id="filter-dropdown">
          <li>Scholarship</li>
          <li>Grant</li>
          <li>Fellowship</li>
          <li>Prize</li>
        </ul>
      </div>
      <div class="dropdown-wrapper">
        <button type="button" id="sort-btn" title="Sort by">
          <i class="fa-solid fa-arrow-up-wide-short"></i>
        </button>
        <ul class="dropdown-menu" id="sort-dropdown">
          <li data-sort="default">Default</li>
          <li data-sort="az">A-Z</li>
          <li data-sort="deadline">Due date</li>
        </ul>
      </div>
    </section>
    <button class="get-tailored-scholarship-btn">
      Get scholarships tailored to you
    </button>
    <dialog class="eligibility-dialog">
      <p>Get scholarships tailored to you</p>
      <form action="" class="eligibility-form">
        <label for="residency">Residency</label>
        <select type="text" name="residency" id="residency" ></select>
        <label for="ed_level">Education level</label>
        <select type="text" name="ed_level" id="ed_level">
          <option value="">Choose education level</option>
          <option value="any">Any</option>
          <option value="middle-school">Middle school</option>
          <option value="high-school">High school</option>
          <option value="high-school-senior">High school senior</option>
          <option value="ged">GED</option>
          <option value="undergraduate">Undergraduate</option>
          <option value="community-college">Community College</option>
          <option value="graduate">Graduate</option>
          <option value="vocational">Vocational</option>
          <option value="adult-returning">Adult returning</option>
        </select>

        <label for="study_field">Field of study</label>
        <input type="text" name="study_field" id="study_field" />
        <label for="gpa">GPA</label>
        <input type="number" name="gpa" id="gpa" />
        <div>
          <button class="eligibility-cancel-btn" type="button">Cancel</button>
          <button class="eligibility-calc-btn" type="submit">
            Tailor scholarships
          </button>
        </div>
      </form>
    </dialog>
    <section class="available-scholarships"></section>
    <script src="index.js"></script>
  </body>
</html>
